<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.25), transparent 35%),
                linear-gradient(135deg, #0f172a, #111827, #1e293b);

            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.5;
        }

        body::before {
            width: 260px;
            height: 260px;
            background: #4f46e5;
            top: -80px;
            left: -60px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #0ea5e9;
            bottom: -100px;
            right: -80px;
        }

        .login-card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 420px;

            padding: 42px 36px;

            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .login-card h1 {
            text-align: center;
            color: white;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .login-card p {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 11px;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-size: 15px;
            outline: none;

            transition: 0.25s;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
            background: rgba(255, 255, 255, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);

            transition: 0.25s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(79, 70, 229, 0.45);
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
        }

        .register-link a {
            color: #a5b4fc;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            color: white;
        }

        @media (max-width: 500px) {

            .login-card {
                margin: 20px;
                padding: 32px 24px;
            }

        }

    </style>
</head>

<body>

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p>Login using your registered mobile number</p>

        <form action="Login.jsp" method="get">

            <div class="form-group">

                <label for="umobile">Mobile Number</label>

                <input
                    type="text"
                    id="umobile"
                    name="umobile"
                    placeholder="Enter registered mobile number"
                    required
                >

            </div>

            <input
                type="submit"
                value="Login"
                class="login-btn"
            >

        </form>

        <div class="register-link">
            New staff member?
            <a href="staff.html">Create an account</a>
        </div>

    </div>

</body>
</html>
